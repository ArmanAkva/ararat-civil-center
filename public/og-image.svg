<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer Elegant Border -->
  <rect x="28" y="28" width="1144" height="574" rx="16" fill="none" stroke="#d4af37" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="36" y="36" width="1128" height="558" rx="12" fill="none" stroke="#d4af37" stroke-opacity="0.1" stroke-width="1" />

  <!-- Badge Pill -->
  <g transform="translate(600, 140)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#d4af37" fill-opacity="0.12" stroke="#d4af37" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="7" text-anchor="middle" fill="#f5d77f" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2">
      ARARAT FORUM · ՔԱՂԱՔԱԿՐԹԱԿԱՆ ԵՐԿԽՈՍՈՒԹՅՈՒՆ
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="270" text-anchor="middle" fill="url(#gold)" font-family="DejaVu Sans, Arial, sans-serif" font-size="64" font-weight="bold">
    ԱՐԱՐԱՏՅԱՆ ՖՈՐՈՒՄ
  </text>

  <!-- Subtitle -->
  <text x="600" y="340" text-anchor="middle" fill="#cbd5e1" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="normal">
    Քաղաքակրթական Ռազմավարական Կենտրոնների և Մտածողների Հարթակ
  </text>

  <text x="600" y="380" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="18">
    Գիտական Հետազոտություններ · Հիմնարար Աշխատություններ · Բանավեճեր
  </text>

  <!-- Divider Line -->
  <line x1="450" y1="430" x2="750" y2="430" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" />

  <!-- 3 Pillars Bottom -->
  <g transform="translate(250, 490)">
    <text x="0" y="0" text-anchor="middle" fill="#f5d77f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">🏛 8 Քաղաքակրթություններ</text>
  </g>
  <g transform="translate(600, 490)">
    <text x="0" y="0" text-anchor="middle" fill="#f5d77f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">📚 Գիտական Գրադարան</text>
  </g>
  <g transform="translate(950, 490)">
    <text x="0" y="0" text-anchor="middle" fill="#f5d77f" font-family="DejaVu Sans, Arial, sans-serif" font-size="20">💬 Կենտրոնների Երկխոսություն</text>
  </g>

  <!-- Website URL footer -->
  <text x="600" y="555" text-anchor="middle" fill="#64748b" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" letter-spacing="1">
    ARARATCIVIL.ORG
  </text>
</svg>

